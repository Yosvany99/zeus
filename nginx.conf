# Bloque para IP local (acceso LAN con certs autofirmados)
server {
    listen 80;
    server_name 192.168.1.2 localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 192.168.1.2 localhost;

    ssl_certificate /home/yos99/zeus/certs/192.168.1.2+2.pem;
    ssl_certificate_key /home/yos99/zeus/certs/192.168.1.2+2-key.pem;

    client_max_body_size 20M;

    location /shopper-events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 40s;
    }
}

# Bloque para DuckDNS (acceso internet con cert Let's Encrypt)
server {
    listen 80;
    server_name zeus-claude.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen 8443 ssl;
    server_name zeus-claude.duckdns.org;

    ssl_certificate /home/yos99/zeus/certs/zeus-claude-fullchain.pem;
    ssl_certificate_key /home/yos99/zeus/certs/zeus-claude-key.pem;

    client_max_body_size 20M;

    location /shopper-events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 40s;
    }
}
